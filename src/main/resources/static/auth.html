<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shark Palace</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: #f4f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .auth-container {
      width: 600px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      display: flex;
    }
    .tabs {
      display: flex;
      flex-direction: column;
      width: 160px;
      background: #eef2f5;
    }
    .tab {
      padding: 20px;
      cursor: pointer;
      font-weight: 500;
      color: #555;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .tab.active {
      background: #ffffff;
      color: #007bff;
      font-weight: 600;
      box-shadow: inset -4px 0 0 #007bff;
    }
    .form-panel {
      flex: 1;
      padding: 30px;
    }
    .form-panel h3 {
      margin-bottom: 1rem;
      color: #333;
    }
    .form-control {
      margin-bottom: 1rem;
    }
    .btn-submit {
      width: 100%;
      padding: 10px;
      font-weight: 500;
    }
    .alert { border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function AuthTabs() {
      const [active, setActive] = useState('login');
      const [login, setLogin] = useState({ userName: '', password: '' });
      const [signup, setSignup] = useState({ username: '', password: '' });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');

      const switchTab = (tab) => {
        setActive(tab);
        setError('');
        setSuccess('');
      };

      const handleChange = (e, formSetter) => {
        formSetter(prev => ({ ...prev, [e.target.name]: e.target.value }));
        if (error) setError('');
      };

      const submitLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch('/auth/v1/login', {
            method: 'POST',
            headers: { 'Content-Type':'application/json' },
            body: JSON.stringify(login)
          });
          if (!res.ok) throw new Error(await res.text());
          setSuccess('Logged in successfully!');
        } catch (err) {
          setError(err.message || 'Login failed.');
        } finally {
          setLoading(false);
        }
      };

      const submitSignup = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch('/auth/v1/signup', {
            method: 'POST',
            headers: { 'Content-Type':'application/json' },
            body: JSON.stringify(signup)
          });
          if (!res.ok) throw new Error(await res.text());
          setSuccess('Account created and logged in!');
        } catch (err) {
          setError(err.message.includes('Already Exists')
            ? 'User exists. Please login.'
            : 'Signup failed.'
          );
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="auth-container">
          <div className="tabs">
            <div
              className={`tab ${active==='login' ? 'active':''}`}
              onClick={()=>switchTab('login')}
            >
              Login
            </div>
            <div
              className={`tab ${active==='signup' ? 'active':''}`}
              onClick={()=>switchTab('signup')}
            >
              Sign Up
            </div>
          </div>
          <div className="form-panel">
            {error && <div className="alert alert-danger">{error}</div>}
            {success && <div className="alert alert-success">{success}</div>}

            {active==='login' ? (
              <form onSubmit={submitLogin}>
                <h3>Login to your account</h3>
                <input
                  type="email"
                  name="userName"
                  className="form-control"
                  placeholder="Email"
                  value={login.userName}
                  onChange={e=>handleChange(e, setLogin)}
                  required
                  disabled={loading}
                />
                <input
                  type="password"
                  name="password"
                  className="form-control"
                  placeholder="Password"
                  value={login.password}
                  onChange={e=>handleChange(e, setLogin)}
                  required
                  disabled={loading}
                />
                <button
                  className="btn btn-primary btn-submit"
                  disabled={loading}
                >
                  {loading?'Signing In…':'Sign In'}
                </button>
              </form>
            ) : (
              <form onSubmit={submitSignup}>
                <h3>Create a new account</h3>
                <input
                  type="email"
                  name="username"
                  className="form-control"
                  placeholder="Email"
                  value={signup.username}
                  onChange={e=>handleChange(e, setSignup)}
                  required
                  disabled={loading}
                />
                <input
                  type="password"
                  name="password"
                  className="form-control"
                  placeholder="Password"
                  value={signup.password}
                  onChange={e=>handleChange(e, setSignup)}
                  minLength="8"
                  required
                  disabled={loading}
                />
                <button
                  className="btn btn-success btn-submit"
                  disabled={loading}
                >
                  {loading?'Creating…':'Sign Up'}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<AuthTabs />, document.getElementById('root'));
  </script>
</body>
</html>
